<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyesore - Eye Tracking for Virtual Meetings</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Eyesore</h1>
      <p class="subtitle">Stay focused on your camera during virtual meetings</p>
    </header>

    <main>
      <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="status-overlay" id="statusOverlay">
          <div class="status-indicator" id="statusIndicator">
            <span class="status-icon" id="statusIcon">●</span>
            <span class="status-text" id="statusText">Initializing...</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary">Start Tracking</button>
        <button id="stopBtn" class="btn btn-secondary" disabled>Stop Tracking</button>
      </div>

      <div class="settings">
        <h2>Settings</h2>
        <div class="setting-item">
          <label for="sensitivity">Sensitivity:</label>
          <input type="range" id="sensitivity" min="0.05" max="0.5" step="0.05" value="0.15">
          <span id="sensitivityValue">0.15</span>
        </div>
        <div class="setting-item">
          <label for="notificationDelay">Notification Delay (seconds):</label>
          <input type="range" id="notificationDelay" min="1" max="10" step="1" value="3">
          <span id="notificationDelayValue">3</span>
        </div>
      </div>

      <div class="permissions" id="permissions">
        <div class="permission-item">
          <span class="permission-label">Camera:</span>
          <span class="permission-status" id="cameraPermission">Not requested</span>
        </div>
        <div class="permission-item">
          <span class="permission-label">Notifications:</span>
          <span class="permission-status" id="notificationPermission">Not requested</span>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
